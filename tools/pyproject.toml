[project]
name = "lottie2matter"
version = "0.1.0"
description = "Convert Lottie/dotLottie animations into Matter WS2812 animation payloads"
authors = [
    { name = "abu-matterize", email = "abu@matterize.io" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "rlottie-python>=1.3.8",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = ""
module-name = "matter_anim"
