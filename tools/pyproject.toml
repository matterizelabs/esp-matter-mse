[project]
name = "matter-effects"
version = "0.1.0"
description = "Generate WS2812 LED effects as Matter stream payloads"
authors = [
    { name = "abu-matterize", email = "abu@matterize.io" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = ""
module-name = "matter_stream"
