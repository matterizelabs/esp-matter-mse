name: build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ''
  push:
    branches: ['**']
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'sdkconfig*'
      - 'partitions.csv'
      - 'shared/**'
      - 'docs/esp-matter-patches/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'sdkconfig*'
      - 'partitions.csv'
      - 'shared/**'
      - 'docs/esp-matter-patches/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  firmware:
    runs-on: self-hosted
    container: espressif/esp-matter:release-v1.6_idf_v6.0.2
    steps:
      - uses: actions/checkout@v5

      - name: Apply esp-matter patch
        run: |
          cd "$ESP_MATTER_PATH"
          git apply "$GITHUB_WORKSPACE/docs/esp-matter-patches/0001-fix-long-octet-string-ember-size.patch"

      - name: Build firmware
        env:
          CLI_PROJECT_VER: ${{ inputs.version }}
        run: |
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          if [ -n "$CLI_PROJECT_VER" ]; then
            idf.py -DCLI_PROJECT_VER="${CLI_PROJECT_VER#v}" build
          else
            idf.py build
          fi

      - name: Publish release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/matter_mse.bin
          generate_release_notes: true
